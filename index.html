<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>文枢问答 2.0 · 四大名著</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Serif SC', 'Source Han Serif SC', serif;
    }
    body {
      background: #f3ede7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background-image: radial-gradient(circle at 20% 30%, rgba(190, 165, 140, 0.05) 0%, transparent 60%);
    }
    .app {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 251, 245, 0.88);
      backdrop-filter: blur(3px);
      border-radius: 56px 56px 40px 40px;
      box-shadow: 0 24px 60px rgba(80, 55, 35, 0.10), 0 6px 20px rgba(0,0,0,0.02);
      padding: 28px 24px 32px;
      border: 1px solid rgba(220, 200, 180, 0.25);
      transition: all 0.2s;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(180, 160, 140, 0.15);
      padding-bottom: 14px;
    }
    .title-group { display: flex; flex-direction: column; }
    .main-title {
      font-size: 28px;
      font-weight: 600;
      color: #2f2219;
      letter-spacing: 2px;
    }
    .main-title small {
      font-size: 16px;
      font-weight: 400;
      color: #8b7a68;
      letter-spacing: 3px;
      margin-left: 6px;
    }
    .sub-title {
      font-size: 14px;
      color: #9b8a78;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-badge {
      background: #e6dbcf;
      padding: 5px 18px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 500;
      color: #3e2e22;
      border: 1px solid rgba(200, 175, 150, 0.2);
      box-shadow: inset 0 1px 3px rgba(255, 240, 220, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-badge span { font-weight: 300; color: #5f4d3a; }
    .btn-roll {
      background: rgba(200, 180, 160, 0.2);
      border: none;
      border-radius: 40px;
      padding: 5px 12px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid rgba(180, 160, 140, 0.2);
      background: #f3ede7;
    }
    .btn-roll:active { transform: scale(0.92); }
    /* book intro */
    .book-intro {
      background: rgba(240, 230, 218, 0.3);
      border-radius: 28px;
      padding: 16px 20px;
      margin: 6px 0 18px;
      border-left: 4px solid #b8a084;
      backdrop-filter: blur(2px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .book-intro-text {
      font-size: 15px;
      color: #3f3227;
      line-height: 1.5;
      flex: 1;
      min-width: 180px;
    }
    .book-intro-text strong { color: #5f4a34; font-weight: 600; }
    .book-intro-badge {
      background: #dacfc4;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 14px;
      color: #2f2219;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 10px;
      background: #e2d4c8;
    }
    /* progress */
    .progress-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: rgba(235, 222, 208, 0.2);
      padding: 6px 16px 6px 18px;
      border-radius: 60px;
      border: 1px solid rgba(200, 180, 160, 0.12);
      flex-wrap: wrap;
    }
    .q-counter { font-size: 15px; color: #5f4d3a; }
    .q-counter span { font-weight: 600; color: #2f2219; }
    .progress-track {
      flex: 1;
      min-width: 60px;
      height: 5px;
      background: #ddd0c0;
      border-radius: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ad8b70;
      border-radius: 12px;
      transition: width 0.3s;
    }
    .book-status {
      font-size: 13px;
      color: #8b7a68;
      background: rgba(200, 180, 160, 0.15);
      padding: 2px 14px;
      border-radius: 30px;
      white-space: nowrap;
    }
    /* question */
    .question-card {
      background: rgba(250, 244, 236, 0.4);
      border-radius: 32px;
      padding: 22px 20px 16px;
      margin: 8px 0 18px;
      border: 1px solid rgba(210, 190, 170, 0.15);
      backdrop-filter: blur(2px);
    }
    .q-text {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.6;
      color: #2f2219;
      border-bottom: 1px dashed rgba(180, 160, 140, 0.2);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .opt {
      display: flex;
      align-items: center;
      background: rgba(255, 248, 240, 0.4);
      border: 1.5px solid rgba(200, 180, 162, 0.2);
      border-radius: 60px;
      padding: 12px 18px;
      cursor: pointer;
      transition: 0.12s;
      backdrop-filter: blur(2px);
    }
    .opt:hover:not(.disabled) { background: rgba(235, 218, 200, 0.3); border-color: #b89f88; transform: scale(1.01); }
    .opt.selected { background: #e5d5c4; border-color: #a5836a; }
    .opt.correct { background: #c8d9c0; border-color: #6f8f6a; }
    .opt.wrong { background: #e7cfc9; border-color: #b57a6e; }
    .opt.disabled { cursor: default; opacity: 0.8; }
    .opt-label { font-weight: 500; color: #5f4d3a; min-width: 28px; }
    .opt-text { font-size: 17px; color: #2f2219; margin-left: 4px; }
    /* actions */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid #cbb8a8;
      padding: 12px 22px;
      border-radius: 60px;
      font-size: 16px;
      background: rgba(250, 242, 232, 0.5);
      backdrop-filter: blur(2px);
      cursor: pointer;
      transition: 0.12s;
      flex: 1 1 auto;
      min-width: 90px;
      font-weight: 480;
      color: #3e2e22;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: #b8a084;
      border-color: #a5886e;
      color: #fcf6ed;
      box-shadow: 0 4px 12px rgba(130, 90, 60, 0.10);
    }
    .btn-primary:active:not(:disabled) { background: #a2876c; transform: scale(0.97); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary { border-color: #d2c0b0; }
    /* result / ranking */
    .result-panel {
      background: rgba(245, 236, 224, 0.4);
      border-radius: 40px;
      padding: 24px 20px 28px;
      margin-top: 12px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(200, 180, 160, 0.12);
    }
    .result-title { font-size: 22px; font-weight: 500; color: #2f2219; text-align: center; }
    .result-score {
      font-size: 44px;
      font-weight: 300;
      text-align: center;
      color: #3e2e22;
      margin: 8px 0;
    }
    .result-score strong { font-weight: 600; color: #1f140e; }
    .result-sub { text-align: center; font-size: 18px; color: #6d5b48; }
    .ranking-box {
      margin-top: 20px;
      background: rgba(250, 242, 232, 0.3);
      border-radius: 28px;
      padding: 14px 18px;
      border: 1px solid rgba(200, 180, 160, 0.15);
    }
    .ranking-title { font-weight: 500; color: #4d3d2e; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
    .ranking-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      background: rgba(255, 248, 240, 0.3);
      border-radius: 40px;
      font-size: 15px;
      color: #3f3227;
      border-bottom: 1px solid rgba(200, 180, 160, 0.05);
    }
    .rank-pos { font-weight: 500; color: #7a6754; }
    .rank-name { font-weight: 500; }
    .rank-score { font-weight: 400; }
    .btn-restart {
      background: #dacfc4;
      border-color: #b8a490;
      padding: 12px 40px;
      margin-top: 16px;
      width: 100%;
      font-weight: 500;
    }
    .hidden { display: none !important; }
    .flex-center { display: flex; align-items: center; gap: 6px; }
    .mt-2 { margin-top: 12px; }
    .gap-2 { gap: 8px; }

    @media (max-width: 500px) {
      .app { padding: 18px 14px; border-radius: 32px; }
      .main-title { font-size: 22px; }
      .q-text { font-size: 18px; }
      .opt-text { font-size: 15px; }
      .btn { font-size: 14px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- header -->
  <div class="header">
    <div class="title-group">
      <div class="main-title">文枢问答 <small>2.0</small></div>
      <div class="sub-title">四部经典 · 三十卷 · 十题问道</div>
    </div>
    <div class="user-area">
      <div class="user-badge">🎓 <span id="userNameDisplay">翰林学士</span></div>
      <button class="btn-roll" id="rollNameBtn" title="掷骰起雅号">🎲</button>
    </div>
  </div>

  <!-- 名著引领介绍 -->
  <div class="book-intro" id="bookIntroArea">
    <div class="book-intro-text" id="bookIntroText">
      <strong>📖 红楼梦</strong> · 中国古典文学巅峰，人情世态之镜。
    </div>
    <div class="book-intro-badge" id="bookIntroBadge">卷·壹</div>
  </div>

  <!-- progress -->
  <div class="progress-area">
    <div class="q-counter">第 <span id="qNum">1</span> / 10 题</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="book-status" id="bookStatus">红楼梦 · 0/10</div>
  </div>

  <!-- quiz area -->
  <div id="quizArea">
    <div class="question-card">
      <div class="q-text" id="qText">加载题目...</div>
      <div class="options" id="optionsContainer"></div>
    </div>
    <div class="action-bar">
      <button class="btn btn-secondary" id="switchBookBtn">📚 换卷</button>
      <button class="btn btn-primary" id="nextBtn" disabled>下一题 →</button>
    </div>
  </div>

  <!-- result + ranking -->
  <div id="resultArea" class="result-panel hidden">
    <div class="result-title" id="resultTitle">🏮 卷终</div>
    <div class="result-score"><strong id="finalScore">0</strong> / 10</div>
    <div class="result-sub" id="resultMessage">文思泉涌</div>
    <div class="result-sub" style="font-size:14px; margin-top:4px;" id="resultBookLabel">红楼梦</div>
    <!-- 称号 -->
    <div style="text-align:center; font-size:20px; font-weight:400; margin:10px 0 4px; color:#4d3d2e;" id="titleAward">🏅 翰林学士</div>
    <!-- 排行榜 -->
    <div class="ranking-box">
      <div class="ranking-title">🏆 文枢榜 <span style="font-size:13px; font-weight:300; color:#8b7a68;">（历史留存）</span></div>
      <div class="ranking-list" id="rankingList">
        <div class="rank-item"><span class="rank-pos">#1</span><span class="rank-name">——</span><span class="rank-score">0</span></div>
      </div>
    </div>
    <button class="btn btn-restart" id="restartBtn">🔄 再答一卷</button>
  </div>

  <!-- 底部 -->
  <div style="margin-top:16px; text-align:center; font-size:12px; color:#b8a898; letter-spacing:2px;">· 文枢 · 匠心 ·</div>
</div>

    // ---------- 存储 ----------
    const STORAGE_KEY = 'wenqu_ranking_v2';
    let ranking = [];
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) ranking = JSON.parse(stored);
    } catch(e) { ranking = []; }

    // ---------- 状态 ----------
    const BOOK_LIST = ['红楼梦','西游记','三国演义','水浒传'];
    const BOOK_INTRO = {
      '红楼梦':'中国古典文学巅峰，人情世态之镜。',
      '西游记':'神魔奇幻之旅，信念与修行。',
      '三国演义':'历史风云，智勇与权谋。',
      '水浒传':'英雄聚义，忠义与抗争。'
    };
    const BOOK_BADGE = { '红楼梦':'卷·壹','西游记':'卷·贰','三国演义':'卷·叁','水浒传':'卷·肆' };

    let currentBook = '红楼梦';
    let currentPool = [];         // 当前名著30题
    let currentRound = [];       // 本次10题
    let currentIndex = 0;        // 0-9
    let selectedIdx = null;
    let isAnswered = false;
    let score = 0;
    let roundStatus = [];        // boolean 10
    let quizFinished = false;
    let userName = '翰林学士';

    // DOM
    const elUserName = document.getElementById('userNameDisplay');
    const elIntroText = document.getElementById('bookIntroText');
    const elIntroBadge = document.getElementById('bookIntroBadge');
    const elQNum = document.getElementById('qNum');
    const elProgressFill = document.getElementById('progressFill');
    const elBookStatus = document.getElementById('bookStatus');
    const elQText = document.getElementById('qText');
    const elOptions = document.getElementById('optionsContainer');
    const elNextBtn = document.getElementById('nextBtn');
    const elSwitchBtn = document.getElementById('switchBookBtn');
    const elQuizArea = document.getElementById('quizArea');
    const elResultArea = document.getElementById('resultArea');
    const elFinalScore = document.getElementById('finalScore');
    const elResultMessage = document.getElementById('resultMessage');
    const elResultBookLabel = document.getElementById('resultBookLabel');
    const elTitleAward = document.getElementById('titleAward');
    const elRankingList = document.getElementById('rankingList');
    const elRestartBtn = document.getElementById('restartBtn');
    const elRollBtn = document.getElementById('rollNameBtn');

    // ---------- 工具 ----------
    function shuffle(arr) {
      for (let i = arr.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickRandom(arr, n) {
      const copy = [...arr];
      shuffle(copy);
      return copy.slice(0, n);
    }

    // 掷骰起名 (符合文枢气质)
    function generateName() {
      const prefix = ['文','墨','书','云','鹤','松','竹','琴','棋','诗','雅','怀','瑾','瑜','砚','笔','卷','典','玄','清','澹','逸','涵','淳','厚','博','智','慧','明','道'];
      const suffix = ['士','君','客','翁','子','生','人','友','贤','才','杰','英','俊','彦','儒','仙','隐','逸','达','观'];
      const p = prefix[Math.floor(Math.random()*prefix.length)];
      const s = suffix[Math.floor(Math.random()*suffix.length)];
      const p2 = prefix[Math.floor(Math.random()*prefix.length)];
      return (Math.random()>0.5) ? p+p2+s : p+s;
    }

    function rollName() {
      userName = generateName();
      elUserName.textContent = userName;
    }

    // ---------- 排行榜 ----------
    function saveRanking() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ranking));
      } catch(e) {}
    }

    function updateRanking(book, scoreVal, name) {
      ranking.push({ book, score: scoreVal, name, time: Date.now() });
      ranking.sort((a,b) => b.score - a.score || a.time - b.time);
      if (ranking.length > 50) ranking = ranking.slice(0, 50);
      saveRanking();
    }

    function renderRanking() {
      if (ranking.length === 0) {
        elRankingList.innerHTML = `<div class="rank-item"><span class="rank-pos">✨</span><span class="rank-name">尚无记录</span><span class="rank-score">—</span></div>`;
        return;
      }
      let html = '';
      ranking.slice(0, 10).forEach((item, idx) => {
        const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`#${idx+1}`;
        html += `<div class="rank-item"><span class="rank-pos">${medal}</span><span class="rank-name">${item.name||'佚名'}</span><span class="rank-score">${item.score}/10 · ${item.book}</span></div>`;
      });
      elRankingList.innerHTML = html;
    }

    // ---------- 核心 ----------
    function initRound(bookName) {
      currentBook = bookName;
      currentPool = FULL_QUESTIONS[bookName] || FULL_QUESTIONS['红楼梦'];
      currentRound = pickRandom(currentPool, 10);
      currentIndex = 0;
      selectedIdx = null;
      isAnswered = false;
      score = 0;
      roundStatus = new Array(10).fill(false);
      quizFinished = false;
      // 更新intro
      elIntroText.innerHTML = `<strong>📖 ${currentBook}</strong> · ${BOOK_INTRO[currentBook]}`;
      elIntroBadge.textContent = BOOK_BADGE[currentBook];
      elBookStatus.textContent = `${currentBook} · 0/10`;
      elResultArea.classList.add('hidden');
      elQuizArea.classList.remove('hidden');
      elNextBtn.disabled = true;
      renderQuestion();
    }

    function renderQuestion() {
      if (quizFinished) return;
      const qd = currentRound[currentIndex];
      if (!qd) return;
      elQText.textContent = qd.q;
      elQNum.textContent = currentIndex+1;
      // progress
      const done = currentIndex + (isAnswered?1:0);
      elProgressFill.style.width = (done/10*100)+'%';
      elBookStatus.textContent = `${currentBook} · ${done}/10`;

      const labels = ['A','B','C','D'];
      let html = '';
      qd.opts.forEach((opt, idx) => {
        let cls = 'opt';
        if (isAnswered) {
          cls += ' disabled';
          if (idx === qd.ans) cls += ' correct';
          else if (selectedIdx === idx && idx !== qd.ans) cls += ' wrong';
        } else {
          if (selectedIdx === idx) cls += ' selected';
        }
        html += `<div class="${cls}" data-opt-index="${idx}"><span class="opt-label">${labels[idx]}.</span><span class="opt-text">${opt}</span></div>`;
      });
      elOptions.innerHTML = html;

      if (!isAnswered) {
        document.querySelectorAll('.opt').forEach(el => {
          el.addEventListener('click', onOptionClick);
        });
      } else {
        document.querySelectorAll('.opt').forEach(el => { el.style.cursor = 'default'; });
      }

      if (isAnswered) {
        const isLast = currentIndex === 9;
        elNextBtn.textContent = isLast ? '📖 卷终' : '下一题 →';
        elNextBtn.disabled = false;
      } else {
        elNextBtn.textContent = '下一题 →';
        elNextBtn.disabled = true;
      }
    }

    function onOptionClick(e) {
      if (isAnswered) return;
      const idx = parseInt(e.currentTarget.dataset.optIndex, 10);
      if (isNaN(idx)) return;
      document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
      e.currentTarget.classList.add('selected');
      selectedIdx = idx;
      elNextBtn.disabled = false;
    }

    function handleNext() {
      if (quizFinished) return;
      if (!isAnswered && selectedIdx === null) return;

      if (isAnswered) {
        if (currentIndex === 9) {
          finishRound();
        } else {
          currentIndex++;
          selectedIdx = null;
          isAnswered = false;
          renderQuestion();
          elNextBtn.disabled = true;
        }
        return;
      }

      // 作答
      const qd = currentRound[currentIndex];
      const correct = selectedIdx === qd.ans;
      if (correct) {
        score++;
        roundStatus[currentIndex] = true;
      } else {
        roundStatus[currentIndex] = false;
      }
      isAnswered = true;
      renderQuestion();
      if (currentIndex === 9) {
        elNextBtn.textContent = '📖 卷终';
        elNextBtn.disabled = false;
      } else {
        elNextBtn.textContent = '下一题 →';
        elNextBtn.disabled = false;
      }
    }

    function finishRound() {
      quizFinished = true;
      elQuizArea.classList.add('hidden');
      elResultArea.classList.remove('hidden');
      elFinalScore.textContent = score;
      elResultBookLabel.textContent = currentBook;

      // 称号
      let title = '';
      if (score === 10) title = '🏆 文曲星下凡';
      else if (score >= 8) title = '📚 博雅学士';
      else if (score >= 6) title = '✍️ 敏思才俊';
      else if (score >= 4) title = '📖 读书君子';
      else title = '🌱 初涉文海';
      elTitleAward.textContent = title;

      // 评语
      const msgs = {
        10:'十题全对，一代文宗！',
        9:'学富五车，才高八斗！',
        8:'腹有诗书，气自华。',
        7:'博观约取，厚积薄发。',
        6:'开卷有益，继续精进。',
        5:'勤能补拙，再读经典。',
        4:'书山有路，步步为营。',
        3:'学而不思则罔，思而不学则殆。',
        2:'锲而不舍，金石可镂。',
        1:'千里之行，始于足下。',
        0:'知耻近乎勇，再起。'
      };
      const msgKey = Math.min(10, Math.max(0, score));
      elResultMessage.textContent = msgs[msgKey] || '文心雕龙';

      // 更新排行榜
      updateRanking(currentBook, score, userName);
      renderRanking();
    }

    // 换卷
    function switchBook() {
      let idx = BOOK_LIST.indexOf(currentBook);
      idx = (idx+1) % BOOK_LIST.length;
      initRound(BOOK_LIST[idx]);
    }

    // 重新开始 (当前名著)
    function restartCurrent() {
      initRound(currentBook);
    }

    // ---------- 初始化 ----------
    function init() {
      // 用户名
      rollName();
      // 初始卷
      initRound('红楼梦');
      renderRanking();

      // 事件
      elNextBtn.addEventListener('click', handleNext);
      elSwitchBtn.addEventListener('click', switchBook);
      elRestartBtn.addEventListener('click', restartCurrent);
      elRollBtn.addEventListener('click', rollName);
    }

    init();
  })();
</script>
