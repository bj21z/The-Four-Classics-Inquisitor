<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>四大名著 · 文枢问答</title>
  <style>
    /* 全局 reset & 设计基调 —— 书卷气 + 现代精致 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe8;  /* 宣纸底色 */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Serif SC', 'Source Han Serif SC', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-image: radial-gradient(circle at 10% 20%, rgba(200, 180, 160, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(160, 130, 100, 0.06) 0%, transparent 50%);
    }

    /* 主卡片 —— 极简留白，层次光影 */
    .app-container {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 252, 245, 0.85);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 48px 48px 40px 40px;
      box-shadow: 0 20px 60px rgba(100, 70, 40, 0.12), 
                  0 8px 24px rgba(0, 0, 0, 0.03),
                  inset 0 1px 0 rgba(255, 247, 235, 0.6);
      padding: 28px 24px 32px;
      transition: all 0.2s ease;
      border: 1px solid rgba(220, 200, 180, 0.3);
    }

    /* 头部 —— 名著印章 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(190, 165, 140, 0.2);
      padding-bottom: 18px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #3e2e22;
      line-height: 1.2;
    }

    .main-title small {
      font-size: 16px;
      font-weight: 400;
      color: #8b7a68;
      letter-spacing: 4px;
      margin-left: 8px;
    }

    .sub-title {
      font-size: 14px;
      color: #9b8a78;
      letter-spacing: 1px;
      margin-top: 4px;
      font-weight: 300;
    }

    .book-badge {
      background: #dacfc4;
      color: #3e2e22;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      background: #e6dbcf;
      box-shadow: inset 0 1px 2px rgba(255, 245, 230, 0.6), 0 2px 4px rgba(90, 60, 30, 0.06);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(220, 195, 170, 0.3);
    }

    /* 进度 & 题号 */
    .progress-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 15px;
      color: #5f4d3a;
      background: rgba(235, 222, 208, 0.3);
      padding: 6px 16px 6px 20px;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(200, 180, 160, 0.15);
    }

    .question-counter {
      font-weight: 450;
      letter-spacing: 0.5px;
    }
    .question-counter span {
      font-weight: 600;
      color: #2f2219;
    }

    .progress-bar-track {
      width: 100px;
      height: 5px;
      background: #ddd0c0;
      border-radius: 12px;
      overflow: hidden;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #ad8b70;
      border-radius: 12px;
      transition: width 0.3s ease;
    }

    /* 问题卡片 */
    .question-card {
      background: rgba(250, 244, 236, 0.6);
      border-radius: 32px;
      padding: 24px 22px 18px;
      margin: 12px 0 20px;
      border: 1px solid rgba(215, 195, 175, 0.2);
      backdrop-filter: blur(2px);
      box-shadow: 0 6px 18px rgba(80, 60, 40, 0.04);
    }

    .question-text {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.6;
      color: #2f2219;
      letter-spacing: 0.3px;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(180, 160, 140, 0.2);
      margin-bottom: 18px;
    }

    /* 选项列表 */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      display: flex;
      align-items: center;
      background: rgba(255, 248, 240, 0.5);
      border: 1.5px solid rgba(200, 180, 162, 0.25);
      border-radius: 60px;
      padding: 12px 18px;
      transition: all 0.15s ease;
      cursor: pointer;
      backdrop-filter: blur(2px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    .option-item:hover:not(.disabled-option) {
      background: rgba(235, 218, 200, 0.4);
      border-color: #b89f88;
      transform: scale(1.01);
    }

    .option-item.selected {
      background: #e5d5c4;
      border-color: #a5836a;
      box-shadow: 0 2px 8px rgba(130, 90, 60, 0.08);
    }

    .option-item.correct-reveal {
      background: #c8d9c0;
      border-color: #6f8f6a;
    }

    .option-item.wrong-reveal {
      background: #e7cfc9;
      border-color: #b57a6e;
    }

    .option-item.disabled-option {
      cursor: default;
      opacity: 0.8;
    }

    .option-label {
      font-weight: 500;
      color: #5f4d3a;
      min-width: 28px;
      font-size: 16px;
    }

    .option-text {
      font-size: 17px;
      font-weight: 400;
      color: #2f2219;
      margin-left: 6px;
      line-height: 1.4;
    }

    /* 底部操作 */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid #cbb8a8;
      padding: 12px 24px;
      border-radius: 60px;
      font-size: 16px;
      font-weight: 480;
      color: #3e2e22;
      background: rgba(250, 242, 232, 0.6);
      backdrop-filter: blur(2px);
      transition: all 0.15s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
      letter-spacing: 0.4px;
      flex: 1 1 auto;
      min-width: 100px;
    }

    .btn-primary {
      background: #b8a084;
      border-color: #a5886e;
      color: #fcf6ed;
      box-shadow: 0 4px 12px rgba(130, 90, 60, 0.12);
    }

    .btn-primary:active:not(:disabled) {
      background: #a2876c;
      transform: scale(0.97);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      border-color: #d2c0b0;
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
    }

    /* 结果卡片 */
    .result-panel {
      background: rgba(245, 236, 224, 0.5);
      border-radius: 40px;
      padding: 28px 22px 30px;
      margin-top: 12px;
      text-align: center;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(200, 180, 160, 0.15);
    }

    .result-score {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #3e2e22;
      line-height: 1.2;
    }
    .result-score strong {
      font-weight: 600;
      color: #2f1f12;
    }
    .result-label {
      font-size: 18px;
      color: #6d5b48;
      margin: 6px 0 12px;
    }

    .result-stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 20px 0 18px;
      font-size: 15px;
      color: #5b4a38;
    }
    .result-stats span {
      background: rgba(220, 200, 180, 0.2);
      padding: 4px 16px;
      border-radius: 40px;
    }

    .btn-restart {
      background: #dacfc4;
      border-color: #b8a490;
      padding: 12px 44px;
      font-weight: 500;
      margin-top: 8px;
    }

    /* 响应式微调 */
    @media (max-width: 500px) {
      .app-container { padding: 20px 16px; border-radius: 32px; }
      .main-title { font-size: 22px; }
      .question-text { font-size: 18px; }
      .option-text { font-size: 15px; }
      .btn { font-size: 14px; padding: 10px 16px; min-width: 70px; }
      .progress-area { flex-wrap: wrap; gap: 4px; }
      .progress-bar-track { width: 70px; }
    }

    /* 工具类 */
    .hidden { display: none !important; }
    .flex-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .mt-1 { margin-top: 6px; }
    .w-full { width: 100%; }

    /* 独特风格 — 微水墨点缀 */
    .decor-dot {
      background: radial-gradient(circle, #b8a084 10%, transparent 70%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      opacity: 0.2;
      margin: 0 6px;
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <!-- 头部 -->
  <div class="header">
    <div class="title-group">
      <div class="main-title">
        文枢问答 <small>· 四大名著</small>
      </div>
      <div class="sub-title">择卷而问 · 十题见真</div>
    </div>
    <div class="book-badge" id="currentBookBadge">红楼梦</div>
  </div>

  <!-- 进度 -->
  <div class="progress-area">
    <div class="question-counter" id="questionCounter">第 <span id="currentQNum">1</span> / 10 题</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
    </div>
  </div>

  <!-- 主区域：问题+选项 -->
  <div id="quizArea">
    <div class="question-card">
      <div class="question-text" id="questionText">加载题目中...</div>
      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" id="resetBookBtn" title="切换名著">📚 换卷</button>
      <button class="btn btn-primary" id="nextBtn" disabled>下一题 →</button>
    </div>
  </div>

  <!-- 结果区域 (默认隐藏) -->
  <div id="resultArea" class="result-panel hidden">
    <div class="result-score"><strong id="finalScore">0</strong> / 10</div>
    <div class="result-label" id="resultMessage">文思泉涌</div>
    <div class="result-stats">
      <span id="correctCountDisplay">✅ 0</span>
      <span id="wrongCountDisplay">❌ 0</span>
    </div>
    <button class="btn btn-restart" id="restartFromResultBtn">🔄 再答一卷</button>
  </div>

  <!-- 底部装饰 -->
  <div style="margin-top: 18px; display: flex; justify-content: center; gap: 4px; opacity: 0.2; font-size: 12px; letter-spacing: 2px;">
    <span>·</span> 文枢 · 匠心 <span>·</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- 题库 ----------
    const BOOKS = {
      '红楼梦': {
        id: 'honglou',
        questions: [
          { q: '“满纸荒唐言，一把辛酸泪”出自哪部作品？', options: ['《红楼梦》', '《西游记》', '《三国演义》', '《水浒传》'], answer: 0 },
          { q: '林黛玉的别号是？', options: ['蘅芜君', '潇湘妃子', '蕉下客', '枕霞旧友'], answer: 1 },
          { q: '贾宝玉的通灵宝玉上刻着什么字？', options: ['莫失莫忘，仙寿恒昌', '不离不弃，芳龄永继', '一除邪祟，二疗冤疾', '知祸福，辨善恶'], answer: 0 },
          { q: '“花谢花飞花满天，红消香断有谁怜”出自哪首诗？', options: ['《秋窗风雨夕》', '《葬花吟》', '《桃花行》', '《芙蓉女儿诔》'], answer: 1 },
          { q: '下列哪位不是金陵十二钗正册人物？', options: ['史湘云', '妙玉', '香菱', '秦可卿'], answer: 2 },
          { q: '贾府四春中，擅长绘画的是？', options: ['元春', '迎春', '探春', '惜春'], answer: 3 },
          { q: '“金玉良缘”指的是？', options: ['贾宝玉与林黛玉', '贾宝玉与薛宝钗', '贾琏与王熙凤', '贾芸与小红'], answer: 1 },
          { q: '刘姥姥几进荣国府？', options: ['一次', '两次', '三次', '四次'], answer: 2 },
          { q: '“寒塘渡鹤影，冷月葬花魂”是谁联句？', options: ['黛玉与湘云', '宝钗与黛玉', '湘云与妙玉', '探春与宝琴'], answer: 0 },
          { q: '《红楼梦》中，贾府最终的结局是？', options: ['重振家业', '被抄家败落', '举家迁往金陵', '归隐山林'], answer: 1 }
        ]
      },
      '西游记': {
        id: 'xiyou',
        questions: [
          { q: '孙悟空被压在五行山下多少年？', options: ['三百年', '五百年', '六百年', '一千年'], answer: 1 },
          { q: '唐僧取经所骑的白龙马，原是什么身份？', options: ['东海龙王三太子', '西海龙王三太子', '南海龙王三太子', '北海龙王三太子'], answer: 1 },
          { q: '猪八戒的兵器叫什么？', options: ['月牙铲', '降妖宝杖', '九齿钉耙', '方天画戟'], answer: 2 },
          { q: '以下哪个不是孙悟空的称号？', options: ['齐天大圣', '斗战胜佛', '美猴王', '金蝉子'], answer: 3 },
          { q: '火焰山是哪个妖怪的地盘？', options: ['红孩儿', '牛魔王', '铁扇公主', '玉面公主'], answer: 2 },
          { q: '“三打白骨精”中，白骨精三次变化分别是什么？', options: ['少女、老妇、老翁', '少女、老翁、孩童', '老妇、老翁、孩童', '少女、孩童、老翁'], answer: 0 },
          { q: '沙和尚原是天庭的什么神将？', options: ['卷帘大将', '天蓬元帅', '托塔天王', '哪吒'], answer: 0 },
          { q: '唐僧的九环锡杖有什么作用？', options: ['降妖伏魔', '持身护体', '开启法门', '增加寿命'], answer: 1 },
          { q: '黄袍怪的妻子是？', options: ['百花羞', '玉面公主', '高翠兰', '铁扇公主'], answer: 0 },
          { q: '取经途中，孙悟空曾向哪个菩萨求助收服红孩儿？', options: ['观音菩萨', '文殊菩萨', '普贤菩萨', '地藏菩萨'], answer: 0 }
        ]
      },
      '三国演义': {
        id: 'sanguo',
        questions: [
          { q: '“宁教我负天下人，休教天下人负我”是谁说的？', options: ['曹操', '刘备', '孙权', '董卓'], answer: 0 },
          { q: '关羽的武器叫什么？', options: ['丈八蛇矛', '青釭剑', '青龙偃月刀', '方天画戟'], answer: 2 },
          { q: '“三顾茅庐”请的是谁？', options: ['诸葛亮', '庞统', '司马懿', '周瑜'], answer: 0 },
          { q: '赤壁之战中，谁献了连环计？', options: ['周瑜', '黄盖', '庞统', '诸葛亮'], answer: 2 },
          { q: '刘备在长坂坡被谁所救？', options: ['张飞', '赵云', '关羽', '马超'], answer: 1 },
          { q: '“既生瑜，何生亮”中的“亮”指谁？', options: ['诸葛亮', '刘备', '关羽', '张飞'], answer: 0 },
          { q: '下列哪位不是五虎上将？', options: ['赵云', '马超', '黄忠', '魏延'], answer: 3 },
          { q: '曹操在官渡之战中大败了哪位军阀？', options: ['袁绍', '袁术', '吕布', '刘表'], answer: 0 },
          { q: '诸葛亮北伐时，谁因失街亭而被斩？', options: ['马谡', '王平', '李严', '魏延'], answer: 0 },
          { q: '三国中，谁被誉为“小霸王”？', options: ['孙权', '孙策', '孙坚', '刘备'], answer: 1 }
        ]
      },
      '水浒传': {
        id: 'shuihu',
        questions: [
          { q: '“林冲雪夜上梁山”中，林冲被迫害前担任什么职位？', options: ['八十万禁军教头', '提辖', '都头', '押司'], answer: 0 },
          { q: '武松的兵器是？', options: ['戒刀', '双鞭', '朴刀', '禅杖'], answer: 0 },
          { q: '宋江的绰号是？', options: ['及时雨', '玉麒麟', '智多星', '豹子头'], answer: 0 },
          { q: '“智取生辰纲”的核心策划者是谁？', options: ['晁盖', '吴用', '公孙胜', '刘唐'], answer: 1 },
          { q: '鲁智深倒拔垂杨柳，他当时在什么寺庙？', options: ['五台山', '相国寺', '少林寺', '灵隐寺'], answer: 1 },
          { q: '下列哪位好汉被称为“鼓上蚤”？', options: ['时迁', '张清', '乐和', '白胜'], answer: 0 },
          { q: '李逵的兵器是？', options: ['双板斧', '单鞭', '长枪', '大刀'], answer: 0 },
          { q: '花荣的绰号是？', options: ['小李广', '金枪手', '插翅虎', '病关索'], answer: 0 },
          { q: '征方腊后，武松的结局是？', options: ['在六和寺出家', '被封官还乡', '战死', '归隐山林'], answer: 0 },
          { q: '“梁山泊”在哪个省？', options: ['山东', '河北', '河南', '江苏'], answer: 0 }
        ]
      }
    };

    // ---------- 状态 ----------
    const bookNames = Object.keys(BOOKS);
    let currentBook = '红楼梦';
    let currentQuestions = BOOKS[currentBook].questions;
    let currentIndex = 0;                // 0-9
    let selectedIndex = null;            // 当前选中选项索引
    let isAnswered = false;              // 是否已作答当前题目
    let score = 0;                      // 答对数量
    let answeredStatus = [];            // 每道题是否答对 (boolean)
    let quizFinished = false;

    // DOM 元素
    const elBookBadge = document.getElementById('currentBookBadge');
    const elQuestionCounter = document.getElementById('currentQNum');
    const elProgressFill = document.getElementById('progressFill');
    const elQuestionText = document.getElementById('questionText');
    const elOptionsContainer = document.getElementById('optionsContainer');
    const elNextBtn = document.getElementById('nextBtn');
    const elResetBookBtn = document.getElementById('resetBookBtn');
    const elQuizArea = document.getElementById('quizArea');
    const elResultArea = document.getElementById('resultArea');
    const elFinalScore = document.getElementById('finalScore');
    const elResultMessage = document.getElementById('resultMessage');
    const elCorrectCountDisplay = document.getElementById('correctCountDisplay');
    const elWrongCountDisplay = document.getElementById('wrongCountDisplay');
    const elRestartFromResultBtn = document.getElementById('restartFromResultBtn');

    // 辅助函数
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 初始化/重置当前名著状态 (保持题目顺序不变，但可打乱；这里保留原序，更显经典)
    function resetBookState(bookName) {
      currentBook = bookName;
      currentQuestions = BOOKS[bookName].questions;
      currentIndex = 0;
      selectedIndex = null;
      isAnswered = false;
      score = 0;
      answeredStatus = new Array(currentQuestions.length).fill(false);
      quizFinished = false;
      elBookBadge.textContent = bookName;
      renderQuestion();
      elResultArea.classList.add('hidden');
      elQuizArea.classList.remove('hidden');
      elNextBtn.disabled = true;
      updateProgress();
    }

    // 渲染当前题目
    function renderQuestion() {
      if (quizFinished) return;
      const qData = currentQuestions[currentIndex];
      if (!qData) return;

      elQuestionText.textContent = qData.q;
      elQuestionCounter.textContent = currentIndex + 1;
      updateProgress();

      // 生成选项
      const labels = ['A', 'B', 'C', 'D'];
      let html = '';
      qData.options.forEach((opt, idx) => {
        let classes = 'option-item';
        if (isAnswered) {
          classes += ' disabled-option';
          if (idx === qData.answer) classes += ' correct-reveal';
          else if (selectedIndex === idx && idx !== qData.answer) classes += ' wrong-reveal';
        } else {
          if (selectedIndex === idx) classes += ' selected';
        }
        html += `
          <div class="${classes}" data-opt-index="${idx}">
            <span class="option-label">${labels[idx]}.</span>
            <span class="option-text">${opt}</span>
          </div>
        `;
      });
      elOptionsContainer.innerHTML = html;

      // 绑定选项点击事件 (仅当未作答)
      if (!isAnswered) {
        document.querySelectorAll('.option-item').forEach(el => {
          el.addEventListener('click', onOptionClick);
        });
      } else {
        // 已作答，移除点击
        document.querySelectorAll('.option-item').forEach(el => {
          el.style.cursor = 'default';
        });
      }

      // 更新下一题按钮
      if (isAnswered) {
        const isLast = currentIndex === currentQuestions.length - 1;
        elNextBtn.textContent = isLast ? '📖 览卷终' : '下一题 →';
        elNextBtn.disabled = false;
      } else {
        elNextBtn.textContent = '下一题 →';
        elNextBtn.disabled = true;
      }
    }

    // 选项点击处理
    function onOptionClick(e) {
      if (isAnswered) return;
      const target = e.currentTarget;
      const idx = parseInt(target.dataset.optIndex, 10);
      if (isNaN(idx)) return;

      // 清除之前选中样式
      document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
      target.classList.add('selected');
      selectedIndex = idx;
      // 启用下一题
      elNextBtn.disabled = false;
    }

    // 下一题或完成
    function handleNext() {
      if (quizFinished) return;

      // 如果未作答且没有选中，不能继续
      if (!isAnswered && selectedIndex === null) {
        // 轻提示，但不强制
        return;
      }

      // 若已作答，直接跳转或结束
      if (isAnswered) {
        if (currentIndex === currentQuestions.length - 1) {
          finishQuiz();
        } else {
          currentIndex++;
          selectedIndex = null;
          isAnswered = false;
          renderQuestion();
          elNextBtn.disabled = true;
        }
        return;
      }

      // 未作答，有选中 -> 判定
      const qData = currentQuestions[currentIndex];
      const correct = selectedIndex === qData.answer;
      if (correct) {
        score++;
        answeredStatus[currentIndex] = true;
      } else {
        answeredStatus[currentIndex] = false;
      }
      isAnswered = true;
      // 显示正误样式
      renderQuestion(); // 重新渲染展示正确/错误
      // 若最后一题，完成时自动finish
      if (currentIndex === currentQuestions.length - 1) {
        // 启用下一题 (finish)
        elNextBtn.textContent = '📖 览卷终';
        elNextBtn.disabled = false;
      } else {
        elNextBtn.textContent = '下一题 →';
        elNextBtn.disabled = false;
      }
    }

    // 完成测验
    function finishQuiz() {
      quizFinished = true;
      elQuizArea.classList.add('hidden');
      elResultArea.classList.remove('hidden');
      const correctCount = score;
      const wrongCount = currentQuestions.length - correctCount;
      elFinalScore.textContent = correctCount;
      elCorrectCountDisplay.textContent = `✅ ${correctCount}`;
      elWrongCountDisplay.textContent = `❌ ${wrongCount}`;

      let msg = '';
      if (correctCount === 10) msg = '🏆 登峰造极 · 文曲降世';
      else if (correctCount >= 8) msg = '📚 博闻强识 · 大家风范';
      else if (correctCount >= 6) msg = '✍️ 熟读经典 · 颇有见地';
      else if (correctCount >= 4) msg = '📖 初窥门径 · 继续精进';
      else msg = '🌱 书山有路 · 再读不迟';
      elResultMessage.textContent = msg;
    }

    // 更新进度条
    function updateProgress() {
      const total = currentQuestions.length;
      const done = currentIndex + (isAnswered ? 1 : 0);
      const pct = Math.min(100, (done / total) * 100);
      elProgressFill.style.width = pct + '%';
    }

    // 切换名著 (换卷)
    function switchBook() {
      let idx = bookNames.indexOf(currentBook);
      idx = (idx + 1) % bookNames.length;
      resetBookState(bookNames[idx]);
      // 重置状态
      quizFinished = false;
      elResultArea.classList.add('hidden');
      elQuizArea.classList.remove('hidden');
      elNextBtn.disabled = true;
    }

    // 从结果页重新开始 (继续当前名著)
    function restartCurrentBook() {
      resetBookState(currentBook);
    }

    // ---------- 事件绑定 ----------
    elNextBtn.addEventListener('click', handleNext);

    elResetBookBtn.addEventListener('click', function() {
      if (quizFinished) {
        // 若在结果页，点击换卷直接切换
        switchBook();
      } else {
        switchBook();
      }
    });

    elRestartFromResultBtn.addEventListener('click', function() {
      restartCurrentBook();
    });

    // 初始化
    resetBookState('红楼梦');

    // 键盘/辅助 (可选项)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !elNextBtn.disabled) {
        elNextBtn.click();
      }
    });

  })();
</script>
</body>
</html>
